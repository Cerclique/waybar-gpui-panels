[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
waybar_gpui = { version = "0.2.0", features = ["components"] }
panel-github = { path = "crates/panel-github" }
